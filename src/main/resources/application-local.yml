spring:
  datasource:
    url: jdbc:postgresql://localhost:${BATON_DB_PORT:5432}/baton
    username: baton
    password: baton
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 약관 시드는 local·test에서만. prod는 application.yml의 db/migration만 사용한다.
    locations: classpath:db/migration,classpath:db/seed/local

logging:
  level:
    org.hibernate.SQL: debug

baton:
  auth:
    # 로컬 전용 키. 운영 값과 절대 공유하지 말 것
    jwt-secret: local-only-baton-jwt-secret-0123456789abcdef
    google:
      client-ids: local-google-client-id
    apple:
      client-ids: local.apple.bundle.id
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
