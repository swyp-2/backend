spring:
  datasource:
    url: jdbc:postgresql://localhost:${BATON_DB_PORT:5432}/baton
    username: baton
    password: baton
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 약관 시드는 local·test에서만. prod는 application.yml의 db/migration만 사용한다.
    locations: classpath:db/migration,classpath:db/seed/local

logging:
  level:
    org.hibernate.SQL: debug
