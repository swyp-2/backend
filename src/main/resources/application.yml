spring:
  application:
    name: baton
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 파일 이름은 V{yyyyMMddHHmm}__{a|b}_{설명}.sql (타임스탬프 버전).
    # 머지 순서가 엇갈려 더 이른 번호가 나중에 들어와도 적용되게 한다
    out-of-order: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  web:
    error:
      include-stacktrace: never
      include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

baton:
  auth:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    apple:
      jwk-set-uri: https://appleid.apple.com/auth/keys
