spring:
  application:
    name: baton
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false

server:
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

baton:
  auth:
    # 로그인 세션 수명. 사용해도 연장하지 않고, 만료되면 다시 소셜 로그인한다.
    access-token-ttl: 14d
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    apple:
      jwk-set-uri: https://appleid.apple.com/auth/keys
