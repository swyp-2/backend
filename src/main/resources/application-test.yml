# 데이터소스는 Testcontainers(@ServiceConnection)가 주입한다.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed/local

logging:
  level:
    org.testcontainers: info

baton:
  # 스케줄러는 끄고 테스트에서 job 메서드를 직접 호출한다
  scheduling:
    enabled: false
  auth:
    jwt-secret: test-only-baton-jwt-secret-0123456789abcdef
    google:
      client-ids: test-google-ios,test-google-android,test-google-web
    apple:
      client-ids: test.apple.bundle.id
  shift:
    preview-secret: test-only-baton-shift-preview-secret-0123456789
