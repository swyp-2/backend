services:
  postgres:
    image: postgres:16
    container_name: baton-postgres
    environment:
      POSTGRES_DB: baton
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: baton
      TZ: UTC
    ports:
      - "${BATON_DB_PORT:-5432}:5432"
    volumes:
      - baton-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  baton-pgdata:
